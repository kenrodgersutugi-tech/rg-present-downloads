# Makes a draft release public.
#
# The release pipeline in the rg-present repository always creates a DRAFT, so a
# human can install the build before any church can reach it. This is that last
# step, as a button rather than a hunt through the releases page: it flips the
# draft to published and marks it latest, which is what the download page and
# the updater both read.
#
# Actions -> Publish a release -> Run workflow, with the tag.
name: Publish a release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag of the draft to publish, e.g. v1.0.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # A tag can carry more than one draft: electron-builder makes one and
          # a later upload can make another, so the installer and the blockmap
          # end up in different drafts. Gather them into one before publishing.
          ids="$(gh api "repos/$REPO/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$TAG\" and .draft)] | sort_by(.created_at) | .[].id")"
          if [ -z "$ids" ]; then
            echo "::error::There is no draft tagged $TAG in $REPO."
            exit 1
          fi

          keeper=''
          for id in $ids; do
            if gh api "repos/$REPO/releases/$id" --jq '[.assets[].name] | join(" ")' | grep -q 'RG-Present-Setup.exe'; then
              keeper="$id"
              break
            fi
          done
          if [ -z "$keeper" ]; then
            echo "::error::No draft of $TAG carries RG-Present-Setup.exe."
            exit 1
          fi
          echo "Keeping release $keeper"

          mkdir -p moved
          for id in $ids; do
            [ "$id" = "$keeper" ] && continue
            echo "Folding release $id into $keeper"
            gh api "repos/$REPO/releases/$id" --jq '.assets[] | "\(.id) \(.name)"' | while read -r asset_id name; do
              gh api -H 'Accept: application/octet-stream' "repos/$REPO/releases/assets/$asset_id" > "moved/$name"
              gh api --method POST -H 'Content-Type: application/octet-stream' \
                "https://uploads.github.com/repos/$REPO/releases/$keeper/assets?name=$name" \
                --input "moved/$name" >/dev/null
              echo "  moved $name"
            done
            gh api --method DELETE "repos/$REPO/releases/$id"
            echo "  deleted the empty draft $id"
          done

          # A church downloads the fixed name, and the updater reads latest.yml.
          # Publishing without either would leave the page pointing at nothing.
          assets="$(gh api "repos/$REPO/releases/$keeper" --jq '[.assets[].name] | join(" ")')"
          echo "Assets: $assets"
          for required in RG-Present-Setup.exe latest.yml; do
            case " $assets " in
              *" $required "*) ;;
              *)
                echo "::error::$TAG has no $required, so publishing it would break the download page or the updater."
                exit 1
                ;;
            esac
          done

          gh api --method PATCH "repos/$REPO/releases/$keeper" -F draft=false -F make_latest=true >/dev/null
          echo "Published $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "https://kenrodgersutugi-tech.github.io/rg-present-downloads/" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the download link really works
        env:
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          url="https://github.com/$REPO/releases/latest/download/RG-Present-Setup.exe"
          code="$(curl -sSL -o /dev/null -w '%{http_code}' "$url")"
          echo "$url -> HTTP $code"
          [ "$code" = "200" ] || { echo "::error::The download link does not work."; exit 1; }
